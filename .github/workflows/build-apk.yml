name: Build APK
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Pillow (génération de l'icône)
        run: pip install pillow

      - name: Préparer le projet Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp index.html www/index.html
          npx cap init "Cabine Momo" com.cabine.momo --web-dir www
          npx cap add android

      - name: Icône, écran de démarrage, signature et version
        run: |
          python3 make_android_assets.py android/app/src/main/res
          python3 patch_android.py android ${{ github.run_number }}
          npx cap sync android

      - name: Construire l'APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Cabine-Momo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cabine-momo-apk
          path: Cabine-Momo.apk

      - name: Publier l'APK dans « Releases » (téléchargement direct sur le téléphone)
        if: github.ref_name == 'main' || github.ref_name == 'master'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cabine Momo 1.0.${{ github.run_number }}
          files: Cabine-Momo.apk
