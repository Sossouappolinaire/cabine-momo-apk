<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabine Momo</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mu:#667085;--bd:#e3e6ec;--ac:#0b7a4b;--ac2:#e7f5ee;--dg:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141a;--card:#1a2029;--tx:#eef1f5;--mu:#9aa4b2;--bd:#2a3340;--ac:#3ecf8e;--ac2:#16302a;--dg:#ff7b6b}}
:root[data-theme="dark"]{--bg:#10141a;--card:#1a2029;--tx:#eef1f5;--mu:#9aa4b2;--bd:#2a3340;--ac:#3ecf8e;--ac2:#16302a;--dg:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%}
button.p{background:var(--ac);color:#fff;border:0;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{padding:9px;font-weight:600}.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.k small{color:var(--mu);display:block;font-size:12px}.k b{font-size:18px}.k span{color:var(--mu);font-size:12px;display:block}
.k.big{grid-column:1/-1;background:var(--ac2);border-color:var(--ac)}.k.big b{font-size:26px;color:var(--ac)}
.sc{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.it small{color:var(--mu);display:block}
.x{width:auto;padding:4px 10px;color:var(--dg);background:none}
h2{font-size:15px;margin:0 0 8px}.em{color:var(--mu);text-align:center;padding:8px}
.gear{width:auto;padding:6px 10px;float:right}textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;width:100%;min-height:80px}.hint{font-size:12px;color:var(--mu);margin-top:6px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:14px;width:min(92vw,420px);padding:14px}dialog::backdrop{background:rgba(0,0,0,.5)}
</style>
</head>
<body>
<main>
<button class="gear" id="gear" title="Paramètres">⚙️</button>
<h1 id="biz">📱 Cabine Momo</h1>
<div class="hint" id="st"></div>
<div class="card" id="login" hidden>
  <h2>Connexion</h2>
  <div class="row"><div><label>E-mail</label><input id="l_em" type="email" autocomplete="username"></div></div>
  <div class="row"><div><label>Mot de passe</label><input id="l_pw" type="password" autocomplete="current-password"></div></div>
  <button class="p" id="l_go">Se connecter</button><div class="hint" id="l_msg"></div>
</div>
<div class="card" id="cfg" hidden>
  <h2>Paramètres (administrateur)</h2>
  <div class="row"><div><label>Nom de l’entreprise</label><input id="c_name"></div></div>
  <div class="row"><div><label>Numéro MTN</label><input id="c_mtn" type="tel" inputmode="tel"></div><div><label>Numéro Moov</label><input id="c_moov" type="tel" inputmode="tel"></div></div>
  <div class="row"><div><label>Numéro Celtis</label><input id="c_cel" type="tel" inputmode="tel"></div></div>
  <div class="row"><div><label>Commission dépôt (%)</label><input id="c_rd" type="number" step="0.01" min="0"></div><div><label>Commission retrait (%)</label><input id="c_rr" type="number" step="0.01" min="0"></div><div><label>Commission crédit (%)</label><input id="c_rc" type="number" step="0.01" min="0"></div></div>
  <button class="p" id="c_save">Enregistrer les paramètres</button>
</div>

<div class="card">
  <div class="row">
    <div><label>SIM</label><select id="sim"><option>MTN</option><option>Moov</option><option>Celtis</option></select></div>
    <div><label>Opération</label><select id="type"><option value="dep">Dépôt</option><option value="ret">Retrait</option><option value="cred">Crédit / forfait</option></select></div>
  </div>
  <div class="row">
    <div><label>Montant (F)</label><input id="amt" type="number" inputmode="numeric" min="0" placeholder="0"></div>
    <div><label>Commission (F) — vide = auto</label><input id="pro" type="number" inputmode="numeric" min="0" placeholder="auto"></div>
  </div>
  <button class="p" id="add">Enregistrer</button>
</div>

<div class="card"><h2>Coller des SMS</h2>
  <textarea id="sms" placeholder="Collez ici un ou plusieurs SMS de confirmation…"></textarea>
  <button class="p" id="smsb" style="margin-top:8px">Lire et enregistrer</button>
  <div class="hint" id="smsr">La commission est calculée avec les pourcentages des paramètres ⚙️.</div></div>
<div class="tabs"><button id="t1" class="on">Jour</button><button id="t2">Mois</button></div>
<div id="v1"></div>
<div id="v2" hidden></div>
<p class="em">Les données sont enregistrées sur ce téléphone, puis envoyées en ligne dès que la connexion revient.</p>
</main>
<dialog id="dlg">
  <h2>SMS non reconnu : saisie manuelle</h2>
  <div class="hint" id="d_raw" style="margin:0 0 8px"></div>
  <div class="row"><div><label>SIM</label><select id="d_sim"><option>MTN</option><option>Moov</option><option>Celtis</option></select></div><div><label>Opération</label><select id="d_type"><option value="dep">Dépôt</option><option value="ret">Retrait</option><option value="cred">Crédit / forfait</option></select></div></div>
  <div class="row"><div><label>Montant (F)</label><input id="d_amt" type="number" inputmode="numeric" min="0"></div><div><label>Frais (F)</label><input id="d_frais" type="number" inputmode="numeric" min="0"></div></div>
  <div class="row"><div><label>Commission (F), vide = auto</label><input id="d_pro" type="number" inputmode="numeric" min="0"></div><div><label>Date</label><input id="d_date" type="date"></div></div>
  <div class="row"><button class="p" id="d_ok">Enregistrer</button><button id="d_no">Ignorer</button></div>
</dialog>
<script>
var KEY="cabine_momo_v1",E=[];
try{E=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){E=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(E))}catch(e){}}
function save(){persist();setTimeout(sync,0)}
function td(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var day=td(),mon=td().slice(0,7),$=function(i){return document.getElementById(i)};
var SIMS=["MTN","Moov","Celtis"],TN={dep:"Dépôt",ret:"Retrait",cred:"Crédit/forfait"};
function f(n){return Number(n).toLocaleString("fr-FR")+" F"}
function agg(l){var r={dep:{n:0,a:0},ret:{n:0,a:0},cred:{n:0,a:0},p:0};
l.forEach(function(e){r[e.type].n++;r[e.type].a+=e.amount;r.p+=e.profit});return r}
function cards(r){return '<div class="grid">'+
'<div class="k"><small>Dépôts</small><b>'+f(r.dep.a)+'</b><span>'+r.dep.n+' opération(s)</span></div>'+
'<div class="k"><small>Retraits</small><b>'+f(r.ret.a)+'</b><span>'+r.ret.n+' opération(s)</span></div>'+
'<div class="k"><small>Crédit / forfait</small><b>'+r.cred.n+' vente(s)</b><span>'+f(r.cred.a)+'</span></div>'+
'<div class="k big"><small>Bénéfice</small><b>'+f(r.p)+'</b></div></div>'}
function simTable(l){var h='<div class="card sc"><h2>Par SIM</h2><table><tr><th>SIM</th><th>Dépôts</th><th>Retraits</th><th>Crédit</th><th>Bénéf.</th></tr>';
SIMS.forEach(function(s){var r=agg(l.filter(function(e){return e.sim===s}));
h+='<tr><td>'+s+(C[s]?'<br><small style="color:var(--mu)">'+C[s]+'</small>':'')+'</td><td>'+f(r.dep.a)+'</td><td>'+f(r.ret.a)+'</td><td>'+f(r.cred.a)+'</td><td>'+f(r.p)+'</td></tr>'});
return h+'</table></div>'}
function render(){
var dl=E.filter(function(e){return e.date===day});
var h='<div class="card"><label>Date</label><input type="date" id="dp" value="'+day+'"></div>'+cards(agg(dl))+simTable(dl);
h+='<div class="card"><h2>Opérations du jour</h2>';
if(!dl.length)h+='<div class="em">Aucune opération.</div>';
dl.slice().reverse().forEach(function(e){h+='<div class="it"><div><b>'+e.sim+' · '+TN[e.type]+'</b><small>'+f(e.amount)+' · bénéfice '+f(e.profit)+(e.frais?' · frais '+f(e.frais):'')+'</small></div><button class="x" data-id="'+e.id+'">Suppr.</button></div>'});
$("v1").innerHTML=h+'</div>';
var ml=E.filter(function(e){return e.date.slice(0,7)===mon});
var m='<div class="card"><label>Mois</label><input type="month" id="mp" value="'+mon+'"></div>'+cards(agg(ml))+simTable(ml);
var days={};ml.forEach(function(e){(days[e.date]=days[e.date]||[]).push(e)});
m+='<div class="card sc"><h2>Bénéfice par jour</h2>';
var ks=Object.keys(days).sort().reverse();
if(!ks.length)m+='<div class="em">Aucune donnée ce mois-ci.</div>';
else{m+='<table><tr><th>Jour</th><th>Dépôts</th><th>Retraits</th><th>Bénéf.</th></tr>';
ks.forEach(function(k){var r=agg(days[k]);m+='<tr><td>'+k.slice(8)+'/'+k.slice(5,7)+'</td><td>'+f(r.dep.a)+'</td><td>'+f(r.ret.a)+'</td><td>'+f(r.p)+'</td></tr>'});m+='</table>'}
$("v2").innerHTML=m+'</div>';
var dp=$("dp"),mp=$("mp");
if(dp)dp.onchange=function(){day=dp.value||td();render()};
if(mp)mp.onchange=function(){mon=mp.value||td().slice(0,7);render()};
}
$("add").onclick=function(){
var a=parseFloat($("amt").value),p=$("pro").value===""?rate($("type").value,a):(parseFloat($("pro").value)||0);
if(!(a>=0)||$("amt").value===""){$("amt").focus();return}
E.push({id:Date.now()+"",date:day,sim:$("sim").value,type:$("type").value,amount:a,profit:p,source:"manuel"});
save();$("amt").value="";$("pro").value="";render();$("amt").focus()};
$("v1").onclick=function(ev){var id=ev.target.getAttribute("data-id");
if(id&&confirm("Supprimer cette opération ?")){var d=E.filter(function(e){return e.id===id})[0];if(d&&d.synced){DEL.push(id);persistDel()}E=E.filter(function(e){return e.id!==id});save();render()}};
function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}
$("t1").onclick=function(){tab(1)};$("t2").onclick=function(){tab(2)};
var CK="cabine_momo_cfg",C={};
try{C=JSON.parse(localStorage.getItem(CK)||"{}")}catch(e){C={}}
function rate(t,a){var q=parseFloat(C["r_"+t])||0;return Math.round(a*q)/100}
function cfgShow(){$("c_name").value=C.name||"";$("c_mtn").value=C.MTN||"";$("c_moov").value=C.Moov||"";$("c_cel").value=C.Celtis||"";$("c_rd").value=C.r_dep||"";$("c_rr").value=C.r_ret||"";$("c_rc").value=C.r_cred||"";$("biz").textContent="📱 "+(C.name||"Cabine Momo")}
$("gear").onclick=function(){$("cfg").hidden=!$("cfg").hidden};
$("c_save").onclick=function(){C={name:$("c_name").value.trim(),MTN:$("c_mtn").value.trim(),Moov:$("c_moov").value.trim(),Celtis:$("c_cel").value.trim(),r_dep:$("c_rd").value,r_ret:$("c_rr").value,r_cred:$("c_rc").value};
try{localStorage.setItem(CK,JSON.stringify(C))}catch(e){}cfgShow();$("cfg").hidden=true;pd=true;render();sync()};
cfgShow();if(!C.name)$("cfg").hidden=false;
function num(x){return parseFloat(String(x).replace(/[\s.,]/g,""))||0}
function parseSms(t){
var m=t.match(/(Retrait|D[ée]p[ôo]t|Cr[ée]dit|Forfait|Recharge)\s+([\d\s.,]+?)\s*F/i);
if(!m)return null;
var k=m[1].toLowerCase(),type=k.charAt(0)==="d"?"dep":(k.indexOf("retrait")===0?"ret":"cred");
var g=function(re){var x=t.match(re);return x?x[1]:""};
return{type:type,amount:num(m[2]),frais:num(g(/Frais\s*:?\s*([\d\s.,]+?)\s*F/i)),ref:g(/ID\s*:?\s*(\d+)/i),date:g(/(\d{4}-\d{2}-\d{2})/)||td(),
sim:/moov/i.test(t)?"Moov":/celtis/i.test(t)?"Celtis":/momo|mtn/i.test(t)?"MTN":$("sim").value}}
$("smsb").onclick=function(){
var parts=$("sms").value.split(/(?=(?:Retrait|D[ée]p[ôo]t)\s+\d)/i),ok=0,dup=0,bad=0,last="";
parts.forEach(function(t){if(!t.trim())return;var s=parseSms(t);
if(!s||!s.amount){bad++;Q.push(t);return}
if(s.ref&&E.some(function(e){return e.ref===s.ref})){dup++;return}
E.push({id:Date.now()+"-"+ok+"-"+dup+"-"+bad,date:s.date,sim:s.sim,type:s.type,amount:s.amount,profit:rate(s.type,s.amount),frais:s.frais,ref:s.ref,source:"sms"});ok++;last=s.date});
save();if(last){day=last;mon=last.slice(0,7)}render();
$("smsr").textContent=ok+" enregistré(s), "+dup+" déjà présent(s), "+bad+" non reconnu(s).";if(ok||bad)$("sms").value="";if(Q.length)nextManual()};
var SU="https://ujuiblvtiaknnwjrugki.supabase.co",SK="sb_publishable_ZzBma-mTfltcaHtqQutKyw_s49OB69V",SS="cabine_momo_sess",DK="cabine_momo_del",S=null,DEL=[],Q=[],busy=false,pd=true;
try{S=JSON.parse(localStorage.getItem(SS)||"null")}catch(e){S=null}
try{DEL=JSON.parse(localStorage.getItem(DK)||"[]")}catch(e){DEL=[]}
function persistDel(){try{localStorage.setItem(DK,JSON.stringify(DEL))}catch(e){}}
function setS(j){S=j&&j.access_token?{a:j.access_token,r:j.refresh_token,x:Math.floor(Date.now()/1000)+(j.expires_in||3600)}:null;try{if(S)localStorage.setItem(SS,JSON.stringify(S));else localStorage.removeItem(SS)}catch(e){}}
function auth(q,b){return fetch(SU+"/auth/v1/token?grant_type="+q,{method:"POST",headers:{apikey:SK,"Content-Type":"application/json"},body:JSON.stringify(b)}).then(function(r){return r.json()})}
async function token(){if(!S)return null;if(S.x-60>Date.now()/1000)return S.a;
try{var j=await auth("refresh_token",{refresh_token:S.r});if(j.access_token){setS(j);return S.a}if(j.error_code||j.error){setS(null);uiSync()}}catch(e){}return null}
async function api(path,opt){var t=await token();if(!t)throw new Error("auth");opt=opt||{};opt.headers=Object.assign({apikey:SK,Authorization:"Bearer "+t,"Content-Type":"application/json"},opt.headers||{});return fetch(SU+"/rest/v1/"+path,opt)}
function uiSync(){var n=E.filter(function(e){return !e.synced}).length;
$("login").hidden=!!S;
$("st").textContent=!S?"🔒 Non connecté : données sur ce téléphone seulement":busy?"🔄 Synchronisation…":!navigator.onLine?"📴 Hors ligne"+(n?" · "+n+" en attente":""):n?"⏳ "+n+" en attente d’envoi":"✅ Synchronisé"}
async function sync(){
if(busy||!S||!navigator.onLine){uiSync();return}
busy=true;uiSync();
try{
for(var i=0;i<DEL.length;i++){var r0=await api("operations?id=eq."+encodeURIComponent(DEL[i]),{method:"DELETE"});if(r0.ok){DEL.splice(i,1);i--}else if(r0.status===401)throw 0}
persistDel();
for(var k=0;k<E.length;k++){var e=E[k];if(e.synced)continue;
var r=await api("operations",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:e.id,date:e.date,sim:e.sim,type:e.type,amount:e.amount,profit:e.profit,frais:e.frais||0,ref:e.ref||null,source:e.source||"sms"})});
if(r.ok||r.status===409)e.synced=true;else throw 0}
persist();
if(!C.name){var pr=await api("parametres?id=eq.1&select=data");var pj=await pr.json();
if(pj[0]&&pj[0].data&&pj[0].data.name){C=pj[0].data;try{localStorage.setItem(CK,JSON.stringify(C))}catch(e2){}cfgShow()}}
else if(pd){var rp=await api("parametres",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({id:1,data:C})});if(rp.ok)pd=false}
var g=await api("operations?select=*&order=date.desc&limit=1000");var rows=await g.json();
if(Array.isArray(rows)){var ids={},add=0;E.forEach(function(x){ids[x.id]=1});
rows.forEach(function(x){if(!ids[x.id]&&DEL.indexOf(x.id)<0){add++;E.push({id:x.id,date:x.date,sim:x.sim,type:x.type,amount:Number(x.amount),profit:Number(x.profit),frais:Number(x.frais)||0,ref:x.ref||"",source:x.source,synced:true})}});
if(add)persist()}
}catch(err){}
busy=false;uiSync();render()}
$("l_go").onclick=async function(){$("l_msg").textContent="Connexion…";
try{var j=await auth("password",{email:$("l_em").value.trim(),password:$("l_pw").value});
if(j.access_token){setS(j);$("l_pw").value="";$("l_msg").textContent="";uiSync();sync()}else $("l_msg").textContent="E-mail ou mot de passe incorrect."}
catch(e){$("l_msg").textContent="Pas de connexion internet."}};
function nextManual(){if(!Q.length)return;var t=Q.shift();$("d_raw").textContent=t.trim().slice(0,200);$("d_date").value=td();$("d_amt").value="";$("d_frais").value="";$("d_pro").value="";$("dlg").showModal()}
$("d_ok").onclick=function(){var a=parseFloat($("d_amt").value);if(!(a>=0)||$("d_amt").value==="")return;var ty=$("d_type").value;
E.push({id:Date.now()+"-m",date:$("d_date").value||td(),sim:$("d_sim").value,type:ty,amount:a,profit:$("d_pro").value===""?rate(ty,a):(parseFloat($("d_pro").value)||0),frais:parseFloat($("d_frais").value)||0,ref:"",source:"manuel"});
save();$("dlg").close();render();nextManual()};
$("d_no").onclick=function(){$("dlg").close();nextManual()};
window.addEventListener("online",sync);window.addEventListener("offline",uiSync);setInterval(sync,60000);
uiSync();sync();
render();
</script>
</body>
</html>
